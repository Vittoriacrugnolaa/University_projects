[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-news-classification"
version = "1.0.0"
description = "A reproducible multi-input neural network for hierarchical multi-label news classification."
requires-python = ">=3.10,<3.13"
dependencies = [
    "iterative-stratification>=0.1.9,<1",
    "joblib>=1.3,<2",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
    "seaborn>=0.13,<1",
    "tensorflow>=2.16,<2.21",
]

[project.optional-dependencies]
dev = [
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
